name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      # 1. Генерируем стандартный проект
      - run: flutter create --platforms=android .
      
      # 2. Создаем идеальный манифест через безопасный printf (без сбоев и чтения файлов)
      - run: |
          printf '%s\n' \
          '<manifest xmlns:android="http://github.com"' \
          '    package="com.example.dynamic_island_overlay">' \
          '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' \
          '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />' \
          '    <application' \
          '        android:label="Dynamic Island Setup"' \
          '        android:name="io.flutter.app.FlutterApplication"' \
          '        android:icon="@mipmap/ic_launcher">' \
          '        <service' \
          '            android:name="to.asww.flutter_overlay_window.FlutterOverlayWindowService"' \
          '            android:exported="false" />' \
          '        <activity' \
          '            android:name=".MainActivity"' \
          '            android:exported="true"' \
          '            android:launchMode="singleTop"' \
          '            android:theme="@style/LaunchTheme"' \
          '            android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|locale|layoutDirection|fontScale|screenMonitors|density|verticalScrollbarPosition"' \
          '            android:hardwareAccelerated="true"' \
          '            android:windowSoftInputMode="adjustResize">' \
          '            <meta-data' \
          '                android:name="io.flutter.embedding.android.NormalTheme"' \
          '                android:resource="@style/NormalTheme" />' \
          '            <intent-filter>' \
          '                <action android:name="android.intent.action.MAIN"/>' \
          '                <category android:name="android.intent.category.LAUNCHER"/>' \
          '            </intent-filter>' \
          '        </activity>' \
          '        <meta-data' \
          '            android:name="flutterEmbedding"' \
          '            android:value="2" />' \
          '    </application>' \
          '</manifest>' > android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
